[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chesslm"
version = "0.1.0"
description = "A from-scratch transformer trained on grandmaster chess games as text: tokenization, rule learning, and outcome prediction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gregory Gestrin" }]
keywords = ["transformer", "tokenization", "BPE", "chess", "language model"]
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "python-chess>=1.10",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: end-to-end training smoke tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]

[tool.ruff.lint.isort]
known-first-party = ["chesslm", "evaluate"]

[tool.ruff.lint.per-file-ignores]
# Carried over verbatim from the CSE 142 assignment; kept byte-for-byte on purpose.
"src/chesslm/_reference_tokenizer.py" = ["UP015", "B905"]
"src/chesslm/model.py" = ["I001"]
"src/chesslm/nn_utils.py" = ["F401"]
